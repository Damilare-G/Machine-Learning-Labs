# Lab 4 configuration.
seed: 42
dataset:
  name: adult
  version: 2
  expected_rows: 48842
  expected_cols: 15
positive_label: ">50K"
split:
  test_size: 0.30          # stratified on income, done BEFORE any cleaning
cleaning:
  missing_token: "?"
  lower_quantile: 0.01     # clip bounds come from TRAIN only
  upper_quantile: 0.99
  drop_train_duplicates: true   # exact duplicates, train only; test untouched
model:
  max_iter: 1000
audit:
  sample_size: 50
